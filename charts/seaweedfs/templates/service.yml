apiVersion: v1
kind: Service
metadata:
  name: {{ template "seaweedfs.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ template "seaweedfs.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: seaweedfs
  {{- if .Values.allInOne.service.annotations }}
  annotations:
    {{- toYaml .Values.allInOne.service.annotations | nindent 4 }}
  {{- end }}
spec:
  type: {{ if or .Values.filer.nodePort .Values.filer.nodePortGrpc }}NodePort{{ else }}ClusterIP{{ end }}
  ports:
  # Master ports
  - name: "swfs-master"
    {{- if .Values.master.nodePort }}
    nodePort: {{ .Values.master.nodePort }}
    {{- end }}
    port: {{ .Values.master.port }}
    targetPort: {{ .Values.master.port }}
    protocol: TCP
  - name: "swfs-master-grpc"
    {{- if .Values.master.nodePortGrpc }}
    nodePort: {{ .Values.master.nodePortGrpc }}
    {{- end }}
    port: {{ .Values.master.grpcPort }}
    targetPort: {{ .Values.master.grpcPort }}
    protocol: TCP
  
  # Volume ports
  - name: "swfs-volume"
    {{- if .Values.volume.nodePort }}
    nodePort: {{ .Values.volume.nodePort }}
    {{- end }}
    port: {{ .Values.volume.port }}
    targetPort: {{ .Values.volume.port }}
    protocol: TCP
  - name: "swfs-volume-grpc"
    {{- if .Values.volume.nodePortGrpc }}
    nodePort: {{ .Values.volume.nodePortGrpc }}
    {{- end }}
    port: {{ .Values.volume.grpcPort }}
    targetPort: {{ .Values.volume.grpcPort }}
    protocol: TCP
  
  # Filer ports
  - name: "swfs-filer"
    {{- if .Values.filer.nodePort }}
    nodePort: {{ .Values.filer.nodePort }}
    {{- end }}
    port: {{ .Values.filer.port }}
    targetPort: {{ .Values.filer.port }}
    protocol: TCP
  - name: "swfs-filer-grpc"
    {{- if .Values.filer.nodePortGrpc }}
    nodePort: {{ .Values.filer.nodePortGrpc }}
    {{- end }}
    port: {{ .Values.filer.grpcPort }}
    targetPort: {{ .Values.filer.grpcPort }}
    protocol: TCP
  
  selector:
    app.kubernetes.io/name: {{ template "seaweedfs.name" . }}
    app.kubernetes.io/component: seaweedfs
